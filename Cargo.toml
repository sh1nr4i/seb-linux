[workspace]
resolver = "2"
members = [
    "crates/seb-lockdown-helper",
    "crates/seb-filter",
    "crates/seb-security",
    "crates/seb-config",
    "crates/seb-proctoring",
    "crates/seb-server",
    "crates/seb-platform",
    "crates/seb-web-extension",
    "crates/seb-app",
]

[workspace.package]
version = "0.6.3"
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1.0"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
libc = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
url = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
