name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. 0.6.3-beta)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build multi-distro release packages (.deb, .rpm, .tar.gz) for ${{ matrix.arch }}
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh --all

      - name: Upload ${{ matrix.arch }} release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safe-exam-browser-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  publish-release:
    needs: build-linux-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME#v}"
          fi
          ver="${raw#v}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
          if [[ "$ver" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: safe-exam-browser-linux-*
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: |
          (cd dist && sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS.txt)
          ls -lh dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Safe Exam Browser for Linux ${{ steps.release_meta.outputs.tag }}
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS.txt
