name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install GTK3 & WebKitGTK 4.1 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev

      - name: Run workspace unit tests
        run: cargo test --workspace

      - name: Build Dev Build & verify CLI flags
        run: |
          ./scripts/build.sh --dev
          ./build/bin/safe-exam-browser --version
          ./build/bin/safe-exam-browser --help | grep -q -- '--dev-bypass'

      - name: Build User Build & verify CLI security gate
        run: |
          ./scripts/build.sh --user
          ./build/bin/safe-exam-browser --version
          ! ./build/bin/safe-exam-browser --help | grep -q -- '--dev-bypass'
          test -x build/bin/safe-exam-browser-lockdown
          test -f build/bin/libseb_web_extension.so

      - name: Upload User Build binaries
        uses: actions/upload-artifact@v4
        with:
          name: safe-exam-browser-linux-user-build
          path: build/bin/
          if-no-files-found: error
